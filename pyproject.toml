[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sales-poc"
version = "0.1.0"
description = "Proof of concept of a Dell-style sales prediction AI platform (see dell.md and specs/)."
requires-python = ">=3.11"
# Runtime libraries are added in the subtask that first needs them.
dependencies = [
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sales_poc"]
