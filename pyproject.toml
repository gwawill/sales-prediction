[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sales-poc"
version = "0.1.0"
description = "Proof of concept of a Dell-style sales prediction AI platform (see dell.md and specs/)."
requires-python = ">=3.11"
# Runtime libraries are added in the subtask that first needs them.
dependencies = [
    "pydantic-settings>=2.4",
    "boto3>=1.35",
    "confluent-kafka>=2.6",
    "neo4j>=5.25",
    "certifi>=2024.2.2",
    "fastembed>=0.4",
    "openai>=1.50",
    "pandas>=2.2",
    "faker>=30",
]

[project.scripts]
generate-data = "sales_poc.datagen.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: talks to real cloud services or the real .env; run with: pytest -m integration",
]
# - Integration tests are left out unless asked for. A "-m" given on the command line
#   replaces this one, so "pytest -m integration" runs them.
# - The cache plugin is turned off because Windows blocks the folder rename it does here.
addopts = "-m 'not integration' -p no:cacheprovider"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_poc"]
